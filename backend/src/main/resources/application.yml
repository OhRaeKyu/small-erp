spring:
  application:
    name: small-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp}
    username: ${DB_USERNAME:erp}
    password: ${DB_PASSWORD:erp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  jwt:
    # HS256 서명 키 (32바이트 이상). 운영에서는 반드시 환경변수로 바꾼다.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-0123456789}
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P14D}
  cookie:
    secure: ${COOKIE_SECURE:false}
  seed:
    # local 프로필에서 관리자·샘플 데이터를 넣는다
    enabled: false
    admin-email: ${SEED_ADMIN_EMAIL:admin@smallerp.local}
    admin-password: ${SEED_ADMIN_PASSWORD:admin1234!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
---
spring:
  config:
    activate:
      on-profile: local
app:
  seed:
    enabled: true
