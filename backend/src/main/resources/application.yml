spring:
  application:
    name: small-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp}
    username: ${DB_USERNAME:erp}
    password: ${DB_PASSWORD:erp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    # host(SPRING_MAIL_HOST)가 있을 때만 실제로 발송한다. Gmail 기준 기본값: 587 포트 + STARTTLS.
    # 계정·앱 비밀번호는 저장소에 넣지 않는다 (환경변수 또는 git에 안 올라가는 backend/config/ 파일).
    port: ${SPRING_MAIL_PORT:587}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      # 사업자등록증 5MB + 입력값
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

app:
  jwt:
    # HS256 서명 키 (32바이트 이상). 운영에서는 반드시 환경변수로 바꾼다.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-0123456789}
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P14D}
  cookie:
    secure: ${COOKIE_SECURE:false}
  storage:
    # 첨부파일(사업자등록증) 저장 경로. 웹으로 노출하지 않는 비공개 디렉터리.
    dir: ${STORAGE_DIR:./data/uploads}
  mail:
    # 안내 메일 보낸 사람. SMTP는 spring.mail.host/username/password 환경변수
    # (SPRING_MAIL_HOST 등)가 있을 때만 쓰고, 없으면 메일 내용을 로그로만 남긴다.
    from: ${MAIL_FROM:no-reply@smallerp.local}
  seed:
    # local 프로필에서 관리자·샘플 데이터를 넣는다
    enabled: false
    admin-email: ${SEED_ADMIN_EMAIL:admin@smallerp.local}
    admin-password: ${SEED_ADMIN_PASSWORD:admin1234!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
---
spring:
  config:
    activate:
      on-profile: local
app:
  seed:
    enabled: true
